<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperatura en vivo</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 12%; }
    .temp { font-size: 6em; color: #e67e22; }
    .info { color: #555; }
  </style>
</head>
<body>
  <h1>🌡️ Temperatura del termopar</h1>
  <div id="tempDisplay" class="temp">--.- °C</div>
  <p id="status" class="info">Cargando...</p>

  <script>
    // ⚠️ URL pública de tu bin (agregale /latest al final)
    const binURL = "https://api.jsonbin.io/v3/b/TU_BIN_ID/latest";

    function actualizar() {
      fetch(binURL)
        .then(res => res.json())
        .then(data => {
          const temp = data.record.temperatura;
          if (typeof temp === 'number') {
            document.getElementById('tempDisplay').innerText = temp.toFixed(1) + " °C";
            document.getElementById('status').innerText = "Actualizado: " + new Date().toLocaleTimeString();
          } else {
            throw new Error("Formato inválido");
          }
        })
        .catch(() => {
          document.getElementById('tempDisplay').innerText = "--.- °C";
          document.getElementById('status').innerText = "Esperando datos del sensor...";
        });
    }

    actualizar();
    setInterval(actualizar, 15000);
  </script>
</body>
</html>
